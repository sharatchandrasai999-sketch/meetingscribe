[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meetingscribe"
version = "0.1.0"
description = "Turn a plain-text meeting transcript into a summary and action items."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sharat Chandra Sai Boddu" }]
dependencies = []

[project.scripts]
meetingscribe = "meetingscribe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
